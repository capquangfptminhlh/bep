name: Deploy Bep preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild verified static preview package
        shell: bash
        run: |
          set -euo pipefail
          test -s site-source.part-00
          test -s site-source.part-01
          for f in site-source.repair-02a site-source.repair-02b site-source.repair-02c site-source.repair-03a site-source.repair-03b site-source.repair-03c site-source.repair-04a site-source.repair-04b site-source.repair-04c; do test -s "$f"; done
          for n in 05 06 07 08; do test -s "site-source.part-${n}"; done
          cat \
            site-source.part-00 \
            site-source.part-01 \
            site-source.repair-02a site-source.repair-02b site-source.repair-02c \
            site-source.repair-03a site-source.repair-03b site-source.repair-03c \
            site-source.repair-04a site-source.repair-04b site-source.repair-04c \
            site-source.part-05 site-source.part-06 site-source.part-07 site-source.part-08 \
            > site-source.b64
          echo "b7557f8a473b070116a791b9977e5ee8e010efc5fe959fb29020992ccb99fa62  site-source.b64" | sha256sum -c -
          base64 --decode site-source.b64 > site-source.zip
          echo "2a160a217da58386fbe6276d162982c77217d409006504a43d13f705355a2ed8  site-source.zip" | sha256sum -c -
          rm -rf _site
          mkdir -p _site
          unzip -q site-source.zip -d _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/logo.svg

      - name: Apply Vietnam-only real photography
        run: python tools/apply_visuals.py

      - name: Apply exact bepaau.com.vn contact information
        run: python tools/apply_company_info.py

      - name: Add Vietnamese and English selector
        run: python tools/apply_language_switch.py

      - name: Sync hotline and add Call Zalo Facebook buttons
        run: python tools/apply_contact_buttons.py

      - name: Refresh mobile hero typography and image
        run: python tools/apply_mobile_refresh.py

      - name: Verify preview content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pages = list(Path('_site').glob('*.html'))
          assert len(pages) >= 10, f'expected >=10 HTML pages, got {len(pages)}'
          html = '\n'.join(p.read_text(encoding='utf-8') for p in pages)
          css = Path('_site/styles.css').read_text(encoding='utf-8')
          index = Path('_site/index.html').read_text(encoding='utf-8')
          required = [
            'Bếp Á - Âu',
            '0340890521',
            'cylamthuanphat@gmail.com',
            '43 đường số 6, cư xá Chu Văn An, Bình Thạnh, TP HCM',
            '393/2G Nguyễn Xí, P13, Quận Bình Thạnh, TP HCM',
            '093.307.8500',
            'tel:0933078500',
            'https://zalo.me/0933078500',
            'class="contact-dock"',
            'contact-dock__call',
            'contact-dock__zalo',
            'contact-dock__facebook',
            '8:00 - 20:30, thứ 2 đến thứ 7',
            'Chủ nhật nghỉ',
            'verified-company-schema',
            'class="language-switcher"',
            'translate.google.com/translate?sl=vi&tl=en',
            'assets/vietnam/project-restaurant.jpg',
            'assets/vietnam/project-hotel.jpg',
            'assets/vietnam/project-canteen.jpg',
            'assets/vietnam/project-central.png',
          ]
          for value in required:
              assert value in html, f'missing required preview content: {value}'
          forbidden = [
            '0106163396', 'info@bepaau.com.vn',
            'Thôn 7, Đình Vĩ, xã Hoài Đức, Hà Nội',
            'LK24 Khu đô thị Nam La Khê, phường Hà Đông, Hà Nội',
            '0961 048 405', '0962 554 955', '028 22 404 999', '0904 603 688',
            '0822 122 248', '0832 122 208', '0902 122 208',
            '46B, Đường Số 6, Phường Tân Sơn Nhì, TP.Hồ Chí Minh',
            'images.pexels.com', 'images.unsplash.com', 'unsplash.com/photos/', 'commons.wikimedia.org',
          ]
          for value in forbidden:
              assert value not in html, f'forbidden/old content still present: {value}'
          vn_assets = list(Path('_site/assets/vietnam').glob('*'))
          assert len(vn_assets) >= 12, f'expected >=12 Vietnam image assets, got {len(vn_assets)}'
          assert html.count('class="language-switcher"') == len(pages)
          assert html.count('class="contact-dock"') == len(pages)
          hero = Path('_site/assets/hero-kitchen-clean.webp')
          assert hero.exists() and hero.stat().st_size > 12000
          assert 'hero-title-main' in index and 'mobile-title-break' in index
          assert 'hero-kitchen-clean.webp' in css and 'Mobile hero refresh v11' in css
          print('Pages:', len(pages))
          print('Vietnam image assets:', len(vn_assets))
          print('Mobile typography + new hero + contacts + VI/EN: PASS')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
