name: Deploy Bep preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild verified static preview package
        shell: bash
        run: |
          set -euo pipefail
          test -s site-source.part-00
          test -s site-source.part-01
          for f in site-source.repair-02a site-source.repair-02b site-source.repair-02c site-source.repair-03a site-source.repair-03b site-source.repair-03c site-source.repair-04a site-source.repair-04b site-source.repair-04c; do test -s "$f"; done
          for n in 05 06 07 08; do test -s "site-source.part-${n}"; done

          cat \
            site-source.part-00 \
            site-source.part-01 \
            site-source.repair-02a site-source.repair-02b site-source.repair-02c \
            site-source.repair-03a site-source.repair-03b site-source.repair-03c \
            site-source.repair-04a site-source.repair-04b site-source.repair-04c \
            site-source.part-05 site-source.part-06 site-source.part-07 site-source.part-08 \
            > site-source.b64

          echo "b7557f8a473b070116a791b9977e5ee8e010efc5fe959fb29020992ccb99fa62  site-source.b64" | sha256sum -c -
          base64 --decode site-source.b64 > site-source.zip
          echo "2a160a217da58386fbe6276d162982c77217d409006504a43d13f705355a2ed8  site-source.zip" | sha256sum -c -

          rm -rf _site
          mkdir -p _site
          unzip -q site-source.zip -d _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/logo.svg

      - name: Restore full imagery and typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          site = Path('_site')

          # Replace old Unsplash download endpoints with render-safe CDN URLs.
          direct = {
            'r98ko7v0Vas': 'https://images.unsplash.com/photo-1771574207826-02f0d845e3a7?auto=format&fit=crop&w=1800&q=84',
            'Yxm90BYxq3E': 'https://images.unsplash.com/photo-1774989423979-6a7bf5add3f0?auto=format&fit=crop&w=1600&q=82',
            'F9v4iq0RDZ0': 'https://images.unsplash.com/photo-1765448856922-b97fce59d270?auto=format&fit=crop&w=1600&q=82',
            'KDB8-kQw0Ac': 'https://images.unsplash.com/photo-1764408182167-043042cb086e?auto=format&fit=crop&w=1600&q=82',
            'Y_tMFA6KCcI': 'https://images.unsplash.com/photo-1774101200315-8ac504fa0fd4?auto=format&fit=crop&w=1600&q=82',
            'KhZSSHoS6Xs': 'https://images.unsplash.com/photo-1760001553414-5634201efc36?auto=format&fit=crop&w=1600&q=82',
            'GUvMJU5ZZLg': 'https://images.unsplash.com/photo-1783615312917-9d77b2434c55?auto=format&fit=crop&w=1600&q=82',
            'TNMene5DvQ8': 'https://images.unsplash.com/photo-1582996720676-27b894004e48?auto=format&fit=crop&w=1600&q=82',
            'WNGGc1euT_g': 'https://images.unsplash.com/photo-1760001553414-5634201efc36?auto=format&fit=crop&w=1600&q=82',
            'aCgbkvfkFME': 'https://images.unsplash.com/photo-1771574207826-02f0d845e3a7?auto=format&fit=crop&w=1600&q=82',
            'BrlIqTYR190': 'https://images.unsplash.com/photo-1774989423979-6a7bf5add3f0?auto=format&fit=crop&w=1600&q=82',
            'yTw1v1SIxUE': 'https://images.unsplash.com/photo-1764408182167-043042cb086e?auto=format&fit=crop&w=1600&q=82',
            'YFK5dBI6Ftc': 'https://images.unsplash.com/photo-1771574207826-02f0d845e3a7?auto=format&fit=crop&w=1600&q=82',
          }

          # Local fallbacks if any old local asset reference remains.
          local_images = {
            'assets/hero-kitchen.jpg': direct['r98ko7v0Vas'],
            'assets/project-nha-hang.jpg': direct['Yxm90BYxq3E'],
            'assets/project-khach-san.jpg': direct['TNMene5DvQ8'],
            'assets/project-canteen.jpg': direct['KhZSSHoS6Xs'],
            'assets/project-bep-trung-tam.jpg': direct['aCgbkvfkFME'],
            'assets/repair-tech.jpg': direct['yTw1v1SIxUE'],
            'assets/about-team.jpg': direct['YFK5dBI6Ftc'],
            'assets/contact-visual.jpg': direct['WNGGc1euT_g'],
            'assets/industrial-texture.jpg': direct['TNMene5DvQ8'],
            'assets/article-thiet-ke-bep.jpg': direct['r98ko7v0Vas'],
            'assets/article-bo-tri-nha-hang.jpg': direct['Yxm90BYxq3E'],
            'assets/article-hut-khoi.jpg': direct['F9v4iq0RDZ0'],
            'assets/article-bao-tri.jpg': direct['KDB8-kQw0Ac'],
            'assets/article-xu-ly-loi.jpg': direct['Y_tMFA6KCcI'],
            'assets/article-bep-canteen.jpg': direct['KhZSSHoS6Xs'],
          }

          font_links = ('<link rel="preconnect" href="https://fonts.googleapis.com">'
                        '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
                        '<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">')

          download_re = re.compile(r'https://unsplash\.com/photos/([^/]+)/download\?[^\"\']+')

          def swap_download(match):
            photo_id = match.group(1)
            return direct.get(photo_id, direct['r98ko7v0Vas'])

          for html in site.glob('*.html'):
            text = html.read_text(encoding='utf-8')
            text = download_re.sub(swap_download, text)
            for old, new in local_images.items():
              text = text.replace(old, new)
            if 'fonts.googleapis.com' not in text:
              text = text.replace('<link rel="stylesheet" href="styles.css">', font_links + '<link rel="stylesheet" href="styles.css?v=4">')
            if '<meta name="robots"' not in text:
              text = text.replace('<meta name="viewport" content="width=device-width,initial-scale=1">', '<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">')
            text = text.replace('<script src="script.js"></script>', '<script src="script.js?v=4"></script>')
            html.write_text(text, encoding='utf-8')

          css_path = site / 'styles.css'
          css = css_path.read_text(encoding='utf-8')
          for old, new in local_images.items():
            css = css.replace(old, new)
          css = css.replace(
            'font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif',
            'font-family:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif'
          )
          css += '''

          /* Typography refresh v4 */
          body{font-family:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:400;letter-spacing:-.008em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
          h1,h2,h3,h4,.hero-sub,.menu,.btn,.eyebrow,.stat b,.project-info strong,.article-hero h1{font-family:"Montserrat","Be Vietnam Pro",ui-sans-serif,system-ui,sans-serif}
          .hero h1,.page-hero h1,.article-hero h1{font-weight:900;letter-spacing:-.045em}
          .section-head h2,.repair-copy h2,.project-detail h2{font-weight:800}
          .hero-sub,.menu,.btn,.eyebrow{font-weight:800}
          p,li{font-weight:400}
          .project-card img,.news-card img,.gallery-item img,.repair-photo img,.project-detail img,.about-split img,.article-figure img{filter:saturate(1.06) contrast(1.04)}
          '''
          css_path.write_text(css, encoding='utf-8')
          (site / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          PY

      - name: Verify visual assets are wired
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pages=list(Path('_site').glob('*.html'))
          count=sum(p.read_text(encoding='utf-8').count('images.unsplash.com') for p in pages)
          css=Path('_site/styles.css').read_text(encoding='utf-8')
          print('Direct image CDN references:', count)
          assert count >= 20, f'expected >=20 image references, got {count}'
          assert 'Be Vietnam Pro' in css
          assert 'Montserrat' in css
          assert 'images.unsplash.com' in css
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
