name: Deploy Bep preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild static preview package
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07 08; do
            test -s "site-source.part-${n}"
          done
          cat site-source.part-00 site-source.part-01 site-source.part-02 site-source.part-03 site-source.part-04 site-source.part-05 site-source.part-06 site-source.part-07 site-source.part-08 > site-source.b64
          base64 --decode site-source.b64 > site-source.zip
          rm -rf _site
          mkdir -p _site
          unzip -q site-source.zip -d _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/script.js
          test -f _site/assets/logo.svg

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
